<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    The page <title> shown in the browser tab.
    Each page file can set its own "title" at the top (front matter),
    otherwise it falls back to the site title from _config.yml.
  -->
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- All styling lives in this one CSS file -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Google Font used for headings/body — see assets/css/style.css for how it's used -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  {% include header.html %}

  <main class="site-main">
    {{ content }}
  </main>

  {% include footer.html %}

</body>
</html>
