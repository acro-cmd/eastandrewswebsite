# ============================================================
# EVENTS — edit this file to add, change, or remove events.
# ============================================================
#
# To add a new event: copy one whole block below (from "- date:"
# down to the next "- date:"), paste it, and change the details.
# The order you put them in doesn't matter — the site sorts them
# automatically by date.
#
# Fields:
#   date        REQUIRED. Format: YYYY-MM-DD  (e.g. 2026-09-09)
#   time        Optional. 24-hour format, e.g. "18:00". Leave out
#               for an all-day event (e.g. "applications open").
#   duration    Optional. How long the event runs, in minutes.
#               Defaults to 60 if left out. Only matters if you
#               set a time.
#   title       REQUIRED. Shown as the event's headline.
#   description Short paragraph shown on the card.
#   location    Shown under the description, and used for the
#               "Add to calendar" links.
#
# You do NOT need to mark anything as "past", "today", or
# "upcoming" — the site works that out automatically by comparing
# each date to today's date every time the page loads.
# ============================================================

