# ============================================================
# PUBLICATIONS — edit this file to add, change, or remove
# entries from the Arete Fellowship publications list.
# ============================================================
#
# To add a new publication:
#   1. Put the PDF file in assets/pdfs/ (see README notes)
#   2. Copy one whole block below and change the details
#   3. The list on the site sorts newest-first automatically —
#      you don't need to put entries in any particular order here.
#
# Fields:
#   title       REQUIRED. The publication's title.
#   authors     REQUIRED. Comma-separated is fine, e.g. "A. Smith, J. Doe"
#   date        REQUIRED. Format: YYYY-MM-DD (just used for sorting
#               and the displayed date — day doesn't need to be exact
#               if you only know the month, e.g. use "2026-03-01")
#   topic       REQUIRED. Pick ONE topic per publication — this is
#               what the filter buttons on the page use. Keep topic
#               names consistent (e.g. always "Global Health", not
#               sometimes "Global health" or "global-health").
#   abstract    A 1-3 sentence summary shown in the list.
#   pdf         REQUIRED. Path to the PDF, starting with /assets/pdfs/
# ===========================================================