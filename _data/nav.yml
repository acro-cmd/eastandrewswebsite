# ============================================================
# TOP MENU LINKS
# This is the ONLY file you need to edit to change the nav bar.
# Each item needs a "title" (what people see) and a "url"
# (the page it links to). Order here = order shown on the site.
#
# To ADD a page to the menu: copy one block below, change the
# title and url, and make sure a matching .md file exists in
# the "pages" folder (or the root folder for the homepage).
#
# To REMOVE a page from the menu: delete its block below.
# (You don't have to delete the page file — it just won't
# show up in the nav anymore.)
# ============================================================

- title: "Events"
  url: "/events/"

- title: "STAIR"
  url: "/pages/stair.html"

- title: "Arete Fellowship"
  url: "/pages/arete.html"

- title: "About"
  url: "/"

